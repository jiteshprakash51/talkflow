# TalkFlow web: same-origin /api/* proxied to the api service (compose network).
# Direct deployments (no compose) should bake VITE_API_URL at build time instead.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
